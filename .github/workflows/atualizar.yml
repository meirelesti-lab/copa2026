name: Atualizar Copa 2026

on:
  schedule:
    # O agendador do GitHub é best-effort no plano gratuito: atrasa/pula
    # disparos, então minutos esparsos resultavam em ~2 runs/dia. Adensar a
    # malha (a cada 10 min) aumenta a chance de algum disparo cair perto do
    # fim de cada jogo e evita janelas mortas de várias horas.
    - cron: '*/10 * * * *'
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

# Cron interno e pinger externo disparam o mesmo workflow. Serializa runs para
# evitar dois `git push` competindo (o 2º levaria non-fast-forward e falharia).
concurrency:
  group: atualizar-copa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Atualizar resultados e gerar HTML
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python atualizar.py --no-git

      - name: Commit e push
        run: |
          git config user.name "Copa 2026 Bot"
          git config user.email "copa2026-bot@users.noreply.github.com"
          git add index.html bracket.html resultados.json
          git diff --staged --quiet && echo "Nada novo." || git commit -m "Resultados atualizados - $(date '+%d/%m/%Y %H:%M') UTC"
          git push
