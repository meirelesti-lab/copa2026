name: Atualizar Copa 2026

# A Copa acabou em 19/07/2026 (Espanha 1–0 Argentina). Não há mais placar para
# buscar, então o agendamento automático foi desligado — o workflow só roda
# quando disparado à mão (ex.: backfill de algum jogo que faltou casar).
on:
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

# Cron interno e pinger externo disparam o mesmo workflow. Serializa runs para
# evitar dois `git push` competindo (o 2º levaria non-fast-forward e falharia).
concurrency:
  group: atualizar-copa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Atualizar resultados e gerar HTML
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python atualizar.py --no-git

      - name: Commit e push
        run: |
          git config user.name "Copa 2026 Bot"
          git config user.email "copa2026-bot@users.noreply.github.com"
          git add index.html bracket.html resultados.json
          git diff --staged --quiet && echo "Nada novo." || git commit -m "Resultados atualizados - $(date '+%d/%m/%Y %H:%M') UTC"
          git push
