name: Atualizar Copa 2026

on:
  schedule:
    # Minuto deslocado: o slot ":00" é o mais congestionado do GitHub Actions
    # e os disparos estavam sendo adiados/pulados (~2 runs/dia em vez de 24).
    - cron: '7,37 * * * *'
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests python-dotenv

      - name: Atualizar resultados e gerar HTML
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python atualizar.py --no-git

      - name: Commit e push
        run: |
          git config user.name "Copa 2026 Bot"
          git config user.email "copa2026-bot@users.noreply.github.com"
          git add index.html resultados.json
          git diff --staged --quiet && echo "Nada novo." || git commit -m "Resultados atualizados - $(date '+%d/%m/%Y %H:%M') UTC"
          git push
